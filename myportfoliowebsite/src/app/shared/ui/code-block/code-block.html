<div class="code-block">
  @for (line of lines(); track $index) {
    <div class="code-block__line">
      <span class="code-block__gutter" aria-hidden="true">{{ $index + 1 }}</span>
      <code class="code-block__code">
        @for (token of line; track $index) {<span [class]="'tok-' + (token.kind ?? 'plain')">{{ token.text }}</span>}
      </code>
    </div>
  }
</div>
