@if (src(); as src) {
  <img
    class="profile-photo__img"
    [src]="src"
    [alt]="alt()"
    decoding="async"
    [attr.loading]="priority() ? null : 'lazy'"
    [attr.fetchpriority]="priority() ? 'high' : null"
  />
} @else {
  <!-- Placeholder exibido enquanto não há foto (PROFILE.photoUrl = null em core/profile/profile.ts). -->
  <div class="profile-photo__placeholder" aria-hidden="true">
    <app-icon name="user" [size]="iconSize()" />
    @if (variant() !== 'avatar') {
      <span class="profile-photo__label">{{ placeholder() }}</span>
    }
  </div>
}
